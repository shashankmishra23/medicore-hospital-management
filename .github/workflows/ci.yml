name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test:
    name: Tests (MySQL 8)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start app and database
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: App answers
        run: |
          curl --fail --silent --show-error http://localhost:5000/health
          curl --fail --silent --show-error --output /dev/null http://localhost:5000/login
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
